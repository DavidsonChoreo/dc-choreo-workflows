name: Choreo build check
description: Builds a paved-road app from its lockfile, checks its dependencies for known vulnerabilities, and checks the built site's indexing against the passport.

inputs:
  working-directory:
    description: The app's root.
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install the checks
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
    - name: Decide whether to build
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" build-plan
    - name: Install the app's dependencies
      id: install
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --no-audit --no-fund
    - name: Check dependencies for known vulnerabilities
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" audit
    - name: Build the app
      id: build
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build
    - name: Check indexing
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" indexing
    - name: Explain a failed install or build
      if: failure() && (steps.install.outcome == 'failure' || steps.build.outcome == 'failure')
      shell: bash
      env:
        STEP: ${{ steps.install.outcome == 'failure' && 'Installing the dependencies with `npm ci`' || 'Building the app with `npm run build`' }}
      run: |
        echo "::error file=package.json,title=Build::${STEP} failed. The log above has npm's own message. Check that the app builds on your machine from a fresh clone; if it does, ask Platform Engineering."
