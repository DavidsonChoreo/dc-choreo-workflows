name: Choreo build check
description: Checks dependencies, runtimes and code, then builds a paved-road app from its lockfile, checks it for known vulnerabilities and unused dependencies, and checks the built site's indexing and accessibility (WCAG 2.1 AA).

inputs:
  working-directory:
    description: The app's root.
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install the checks
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
    - name: Check dependencies and runtimes
      id: deps
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        # On a pull request, compare with the base branch's package.json.
        if [ -n "$BASE_REF" ] && git fetch -q --depth=1 origin "$BASE_REF" 2>/dev/null \
          && git show "FETCH_HEAD:./package.json" > "$RUNNER_TEMP/base-package.json" 2>/dev/null; then
          export BASE_PACKAGE_JSON="$RUNNER_TEMP/base-package.json"
        fi
        node "$GITHUB_ACTION_PATH/../../checks/cli.js" dependencies
    - name: Check the code for plain http:// and open CORS
      id: code
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" code
    - name: Decide whether to build
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" build-plan
    - name: Install the app's dependencies
      id: install
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --no-audit --no-fund
    - name: Check dependencies for known vulnerabilities
      id: audit
      continue-on-error: true
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" audit
    - name: Look for unused dependencies
      id: unused
      continue-on-error: true
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "$GITHUB_ACTION_PATH/../../node_modules/.bin/knip" --dependencies --reporter json --no-exit-code \
          > "$RUNNER_TEMP/knip.json" 2>/dev/null || rm -f "$RUNNER_TEMP/knip.json"
        KNIP_REPORT="$RUNNER_TEMP/knip.json" node "$GITHUB_ACTION_PATH/../../checks/cli.js" unused
    - name: Build the app
      id: build
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build
    - name: Check indexing
      id: indexing
      continue-on-error: true
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" indexing
    - name: Check accessibility (WCAG 2.1 AA)
      id: a11y
      continue-on-error: true
      if: steps.plan.outputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/cli.js" accessibility
    - name: Fail if any check failed
      if: always()
      shell: bash
      env:
        OUTCOMES: deps=${{ steps.deps.outcome }} code=${{ steps.code.outcome }} audit=${{ steps.audit.outcome }} unused=${{ steps.unused.outcome }} indexing=${{ steps.indexing.outcome }} accessibility=${{ steps.a11y.outcome }}
      run: |
        # Each check above continues past a failure so the rest still run and
        # the assessor sees every result; this step makes the job fail anyway.
        if echo "$OUTCOMES" | grep -q '=failure'; then
          echo "Failed: $(echo "$OUTCOMES" | tr ' ' '\n' | grep '=failure' | cut -d= -f1 | tr '\n' ' ')"
          exit 1
        fi
    - name: Record the build's result for the assessor
      if: always() && env.CHOREO_RESULT_DIR != '' && steps.plan.outputs.build == 'true'
      shell: bash
      env:
        INSTALL: ${{ steps.install.outcome }}
        BUILD: ${{ steps.build.outcome }}
      run: |
        mkdir -p "$CHOREO_RESULT_DIR"
        node -e '
          const { INSTALL, BUILD, CHOREO_RESULT_DIR } = process.env;
          const problems = [];
          if (INSTALL === "failure") problems.push("Installing the dependencies with npm ci failed.");
          else if (BUILD === "failure") problems.push("Building the app with npm run build failed.");
          const result = INSTALL === "success" && BUILD === "skipped"
            ? { check: "build", skipped: true, reason: "An earlier step stopped the build." }
            : { check: "build", problems, warnings: [] };
          require("fs").writeFileSync(CHOREO_RESULT_DIR + "/build.json", JSON.stringify(result));
        '
    - name: Explain a failed install or build
      if: failure() && (steps.install.outcome == 'failure' || steps.build.outcome == 'failure')
      shell: bash
      env:
        STEP: ${{ steps.install.outcome == 'failure' && 'Installing the dependencies with `npm ci`' || 'Building the app with `npm run build`' }}
      run: |
        echo "::error file=package.json,title=Build::${STEP} failed. The log above has npm's own message. Check that the app builds on your machine from a fresh clone; if it does, ask Platform Engineering."
