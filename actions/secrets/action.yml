name: Choreo secrets check
description: Scans the app's full git history for secrets with gitleaks, and explains each one for the builder. Needs a checkout with fetch-depth 0.

inputs:
  working-directory:
    description: The app's root, a git checkout with its full history.
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install the checks
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
    - name: Install gitleaks
      shell: bash
      env:
        VERSION: 8.30.1
        SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        cd "$RUNNER_TEMP"
        curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar xzf gitleaks.tar.gz gitleaks
    - name: Scan the full history
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 0 \
          --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
    - name: Explain what it found
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: GITLEAKS_REPORT="$RUNNER_TEMP/gitleaks.json" node "$GITHUB_ACTION_PATH/../../checks/cli.js" secrets
