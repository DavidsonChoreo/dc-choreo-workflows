name: Choreo passport check
description: Checks PASSPORT.yml against the passport schema and the business-owner rule, with messages written for builders.

inputs:
  working-directory:
    description: The directory holding PASSPORT.yml. The app's root by default.
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install the check
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
    - name: Check the passport
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../../checks/passport-cli.js"
