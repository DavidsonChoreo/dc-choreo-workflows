# The workflow the lifecycle: hosted ruleset requires on every pull request
# into a hosted app's main. A ruleset can only require a workflow that runs on
# pull requests, so this file exists to call checks.yml, and a builder can't
# remove it.
name: choreo required

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # This repository has no passport of its own.
    if: github.repository != 'DavidsonChoreo/dc-choreo-workflows'
    uses: DavidsonChoreo/dc-choreo-workflows/.github/workflows/checks.yml@v1
