# The Choreo checks, called by every app repository: by its stub on pushes to
# main and on pull requests, and by required.yml on hosted apps' pull requests.
# Each check is its own job, so each shows as its own line on a pull request.
name: choreo checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  passport:
    name: passport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/passport@v1
