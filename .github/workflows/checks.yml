# The Choreo checks. Two callers: required.yml, on a hosted app's pull
# requests, and the publish request, which checks a private incubating app
# from this repository. Incubating apps run nothing of their own.
# Each check is its own job, so each shows as its own line on a pull request.
name: choreo checks

on:
  workflow_call:
    inputs:
      repository:
        description: The app repository to check, as owner/name. The calling repository by default.
        type: string
        default: ''
      ref:
        description: The commit, branch or tag to check. The triggering commit by default.
        type: string
        default: ''
      publish_request:
        description: True when the publish request calls the checks; adds the workspace check, which needs repository_token.
        type: boolean
        default: false
    secrets:
      repository_token:
        description: A token that can read the app repository. Needed when the app is private and not the caller.
        required: false

permissions:
  contents: read

jobs:
  passport:
    name: passport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/check@v1
        with:
          check: passport

  license:
    name: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/check@v1
        with:
          check: license

  tier:
    name: tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/check@v1
        with:
          check: tier

  files:
    name: files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/check@v1
        with:
          check: files

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/secrets@v1

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/build@v1

  workspace:
    name: workspace
    if: inputs.publish_request
    runs-on: ubuntu-latest
    env:
      CHOREO_REPOSITORY: ${{ inputs.repository || github.repository }}
      GITHUB_TOKEN: ${{ secrets.repository_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.repository_token || github.token }}
          persist-credentials: false
      - uses: DavidsonChoreo/dc-choreo-workflows/actions/check@v1
        with:
          check: workspace
