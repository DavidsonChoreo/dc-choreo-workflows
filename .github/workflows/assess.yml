# The assessor: runs every check against an app, then has Claude judge its
# code against the security rubric, and writes report.json, which the three
# approvers read at the ready call. Called by the publish request (#89), or
# by hand. It checks out this repository and uses the actions by local path,
# so the checks and the assessor are always the same version.
#
# The publish request calls it from the private dc-choreo-factory at `v1`
# (pipeline.md, decision 39), so the report and screenshots of an unapproved
# app stay private; the caller passes `workflows_ref: v1` (the default) and
# its secrets. Run by hand here, it uses this run's own commit.
name: assess

on:
  workflow_call:
    inputs:
      repository:
        description: The app repository, as owner/name
        required: true
        type: string
      ref:
        description: The commit, branch or tag to assess
        type: string
        default: ''
      workflows_ref:
        description: The dc-choreo-workflows ref to run, matching the ref the caller named
        type: string
        default: v1
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      CHOREO_READER_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: The app repository, as owner/name
        required: true
        type: string
      ref:
        description: The commit, branch or tag to assess (default branch if empty)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: assess-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    env:
      CHOREO_RESULT_DIR: ${{ github.workspace }}/results
      # The accessibility check saves a PNG of each page here, for the
      # reviewers and the Comms rubric. Only this workflow sets it.
      CHOREO_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
    steps:
      - name: Get a read token for the app
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # davidson-choreo-reader's id: not a secret, and the same from any caller.
          app-id: 5291440
          private-key: ${{ secrets.CHOREO_READER_PRIVATE_KEY }}
          owner: DavidsonChoreo
      - name: Check out the checks and the assessor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidsonChoreo/dc-choreo-workflows
          # Called: the ref the caller named. By hand here: this run's commit.
          ref: ${{ inputs.workflows_ref || github.sha }}
          persist-credentials: false
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.reader.outputs.token }}
          path: app
          fetch-depth: 0
          persist-credentials: false

      - { name: Passport, uses: ./actions/check, continue-on-error: true, with: { check: passport, working-directory: app } }
      - { name: License, uses: ./actions/check, continue-on-error: true, with: { check: license, working-directory: app } }
      - { name: Tier, uses: ./actions/check, continue-on-error: true, with: { check: tier, working-directory: app } }
      - { name: Governance files, uses: ./actions/check, continue-on-error: true, with: { check: files, working-directory: app } }
      - { name: Secrets, uses: ./actions/secrets, continue-on-error: true, with: { working-directory: app } }
      - { name: "Dependencies, code and build", uses: ./actions/build, continue-on-error: true, with: { working-directory: app } }

      - name: Keep the screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Install the document tools
        # poppler-utils counts PDF pages; LibreOffice converts Office files to
        # PDF, and is installed only when the app's history has any.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          if git -C app log --all --format= --name-only | grep -qiE '\.(docx?|pptx?|xlsx?|od[tps])$'; then
            sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui fonts-liberation
          fi
      - name: Assess
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ steps.reader.outputs.token }}
          CHOREO_REPOSITORY: ${{ inputs.repository }}
          CHOREO_SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          npm ci --omit=dev --no-audit --no-fund --loglevel=error
          node assessor/run.js app "$CHOREO_RESULT_DIR" report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report
          path: |
            report.json
            judgments.json
            results/
          if-no-files-found: ignore
